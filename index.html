  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Satoshi', 'General Sans', 'system-ui', 'sans-serif'],
            mono: ['Geist Mono', 'monospace'],
            genty: ['Genty', 'Genty ExtraBold', 'sans-serif'],

          colors: {
            aura: {
              navy: '#162A3B',
              parchment: '#D4A24C',
              ivory: '#FAF8F3',
              warmwhite: '#FAF8F3',
              vermilion: '#FF6B3D',
              orange: '#FF6B3D',
              burgundy: '#F45D48',
              charcoal: '#162A3B'
            }
          }
        }
      }
    }
  </script>
</head>
<body>
  <!-- Hidden Netlify Form Detection for React/Vite SPA Build -->
  <form name="waitlist" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden aria-hidden="true">
    <input type="hidden" name="form-name" value="waitlist" />
    <input type="text" name="bot-field" />
    <input type="email" name="email" />
  </form>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
