# ──────────────────────────────────────────────
# Kontagi — Docker Compose (Production Stack)
# ──────────────────────────────────────────────

services:
  # ── PostgreSQL ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kontagi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kontagi
      POSTGRES_USER: kontagi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kontagi_secret_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/backup:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kontagi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kontagi-net

  # ── Redis ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kontagi-redis
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
        --save 60 1000
        --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kontagi-net

  # ── Ollama (AI Provider — internal only) ───
  ollama:
    image: ollama/ollama:latest
    container_name: kontagi-ollama
    restart: unless-stopped
    # NO ports exposed — only reachable from kontagi-net
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - kontagi-net

  # ── Kontagi Backend ────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kontagi-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://kontagi:${POSTGRES_PASSWORD:-kontagi_secret_change_me}@postgres:5432/kontagi?schema=public
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://ollama:11434

      # Secrets — override in .env or docker secrets
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      CSRF_SECRET: ${CSRF_SECRET:?Set CSRF_SECRET}

      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: lax

      # AI
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL:-llama3.2:1b}
      AI_PROVIDER: auto

      # Email
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@kontagi.com}
      SMTP_FROM_NAME: Kontagi

      APP_URL: ${APP_URL:-http://localhost:5173}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - kontagi-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local

networks:
  kontagi-net:
    driver: bridge
